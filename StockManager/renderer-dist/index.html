<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
<title>Marketing Services</title>
<style>
  :root{
    --accent:#1d4f91; --accent-soft:#eef2f8;
    --nav-on:var(--accent);
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#f2f4f7; --line:#e8eaf0;
    --text:#161a23; --muted:#6b7280; --danger:#dc3545; --ok:#1f7a3d;  /* semantic success — intentionally green, not brand */
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",Cambria,serif;
    --font:var(--sans); --fs:14px;
    --r:14px; --r-sm:9px; --r-lg:18px;
    --shadow:0 1px 2px rgba(17,24,39,.04), 0 6px 18px rgba(17,24,39,.06);
    --shadow-sm:0 1px 2px rgba(17,24,39,.07);
  }
  html[data-theme="dark"]{
    --bg:#0f131c; --panel:#161c28; --panel-2:#1e2531; --line:#2a3240;
    --text:#e7e9ef; --muted:#95a1b4; --danger:#f0716a; --ok:#5ac37e;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:var(--fs)}
  ::selection{background:var(--accent-soft)}
  .app{display:flex;min-height:100vh}

  /* sidebar */
  .side{width:238px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
  .brand .avatar{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 auto;box-shadow:var(--shadow-sm)}
  .brand .bname{font-weight:700;font-size:13.5px;line-height:1.25;color:var(--text)}
  .brand .sub{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.9px;margin-top:3px}
  nav{padding:6px 10px;overflow-y:auto;flex:1}
  .nav-group{margin-bottom:12px}
  .nav-title{color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;padding:6px 10px 4px}
  nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;margin:2px 0;color:var(--muted);text-decoration:none;border-radius:var(--r-sm);font-weight:500;font-size:13px;transition:background .12s,color .12s}
  nav a .ico{width:19px;height:19px;flex:0 0 auto;display:inline-flex;color:currentColor}
  nav a .ico svg{width:19px;height:19px;display:block}
  nav a:hover{background:var(--panel-2);color:var(--text)}
  nav a.on{background:var(--accent-soft);color:var(--nav-on);font-weight:600}
  .side .foot{padding:12px 12px 10px;border-top:1px solid var(--line)}
  .appearance{display:flex;gap:6px;margin-bottom:9px}
  .appearance button{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:var(--r-sm);padding:7px 10px;font-size:11px;font-weight:600;transition:.12s}
  .appearance button:first-child{flex:1;text-align:left}
  .appearance button:hover{color:var(--accent);border-color:var(--accent)}
  .ver{color:var(--muted);font-size:10px;padding:0 3px}

  /* main */
  main{flex:1;min-width:0;padding:24px 30px;max-width:1300px}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
  .head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .right{margin-left:auto}
  .muted{color:var(--muted)}

  /* cards + stats */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .dashgrid{display:grid;gap:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .n{font-size:24px;font-weight:700;letter-spacing:-.6px}
  .stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;font-weight:600}

  /* forms */
  label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:var(--r-sm);outline:none;transition:border .12s,box-shadow .12s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input:disabled,select:disabled{background:var(--panel-2);color:var(--muted)}

  /* buttons */
  .btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:9px 16px;border-radius:var(--r-sm);font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);transition:filter .12s,transform .04s}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:none}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .btn.danger{background:var(--panel);color:var(--danger);border-color:var(--line);box-shadow:none}
  .btn.danger:hover{border-color:var(--danger)}

  /* tables */
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .tablewrap thead th{position:sticky;top:0;z-index:2;background:var(--panel)}
  .tablewrap{max-height:calc(100vh - 190px)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
  kbd{display:inline-block;min-width:20px;text-align:center;padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel-2);font-family:inherit;font-size:11.5px;color:var(--text)}
  .hkrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .hkrow:last-child{border-bottom:0}
  td.num,th.num{text-align:right}
  tbody tr{transition:background .1s}
  tbody tr:hover td{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:0}
  tfoot th{border-top:1px solid var(--line);border-bottom:0;color:var(--text);font-size:12px;background:var(--panel-2)}
  td input{padding:6px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;text-align:right}
  td input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

  /* pills */
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid transparent;font-size:11px;font-weight:600}
  .pill.sale{color:#166534;background:#e6f4ea}
  .pill.replace{color:#9a6a00;background:#fdf1d8}
  .pill.free{color:#2563eb;background:#e6efff}
  html[data-theme="dark"] .pill.sale{color:#8fd3a6;background:#14311f}
  html[data-theme="dark"] .pill.replace{color:#e6c07a;background:#392f16}
  html[data-theme="dark"] .pill.free{color:#8bb6ef;background:#1b2b4a}

  /* segmented control */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
  .seg button{background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line);padding:8px 14px;font-size:12px;font-weight:600}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button:not(.on):hover{background:var(--panel-2);color:var(--text)}

  /* charts */
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
  .chart-card .t{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;display:flex;justify-content:space-between;font-weight:600}
  .chart-card svg{display:block;width:100%;height:auto}
  .chart-card svg text{fill:var(--muted)}
  .chart-card svg .val{fill:var(--text)}
  .chart-card svg .bar{fill:var(--accent)}
  .chart-card svg .bar-bg{fill:var(--panel-2)}
  .chart-card svg .axis{stroke:var(--line)}
  .hbars{display:flex;flex-direction:column;gap:11px}
  .hbar{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;font-size:12.5px}
  .hb-l{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .hb-track{background:var(--panel-2);height:16px;border-radius:6px;overflow:hidden}
  .hb-fill{height:100%;background:var(--accent);border-radius:6px}
  .hb-v{color:var(--muted);white-space:nowrap}
  .donut-wrap{display:flex;align-items:center;gap:18px}
  .donut-wrap svg{width:132px;height:132px;flex:0 0 auto}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
  .legend .lg{display:flex;align-items:center;gap:9px}
  .legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .legend .lv{margin-left:auto;color:var(--muted);font-weight:600}
  .seg-mut{color:var(--muted);font-weight:500}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:56px 16px;z-index:50;overflow:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:560px;box-shadow:0 24px 64px rgba(17,24,39,.28);overflow:hidden}
  .modal h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
  .modal .body{padding:20px}
  .modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--panel-2)}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  /* toast + misc */
  #toast{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:12px 16px;min-width:240px;box-shadow:var(--shadow)}
  .toast.err{border-left-color:var(--danger)}
  .empty{padding:44px;text-align:center;color:var(--muted)}

  /* print */
  /* printable content — styled the same on screen (preview) and on paper */
  .printable{color:#000;font-size:12px}
  .printable table{width:100%;border-collapse:collapse}
  .printable th,.printable td{border:1px solid #000;color:#000;background:#fff !important;padding:3px 5px}
  .printable th{text-transform:none;font-size:11px;letter-spacing:0}
  #printRoot .printable, main .printable, #printRootInline .printable{display:none}
  /* print preview overlay */
  .pvwrap{position:fixed;inset:0;background:rgba(15,19,28,.55);z-index:70;display:flex;flex-direction:column}
  .pvbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .pvbar .ttl{font-weight:700;flex:1}
  .pvscroll{flex:1;overflow:auto;padding:22px}
  .pvpaper{width:210mm;min-height:120mm;margin:0 auto;background:#fff;padding:12mm;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .pvpaper .printable{display:block}
  .pvpaper + .pvpaper{margin-top:18px}
  @media print{
    @page{margin:10mm}
    html,body{background:#fff !important;color:#000;margin:0 !important;padding:0 !important;height:auto !important;min-height:0 !important}
    /* hide the whole app — only #printRoot goes on paper (stops the blank first page) */
    body > *{display:none !important}
    #printRoot{display:block !important}
    #printRoot .printable{display:block !important}
    #printRoot .printable > div{break-inside:auto}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side noprint">
    <div class="brand">
      <div class="avatar" id="brandAvatar">S</div>
      <div><div class="bname" id="brandName">Marketing Services</div><div class="sub">Load &amp; Billing</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="appearance">
        <button id="themeToggle" title="Toggle light / dark">Theme</button>
        <button id="fsDown" title="Smaller text">A&minus;</button>
        <button id="fsUp" title="Larger text">A+</button>
        <button id="hkBtn" title="Keyboard shortcuts (F1)">&#9000; Keys</button>
      </div>
      <div class="ver">Stock Manager v2 · <span id="brandFoot"></span></div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<div id="printRoot"></div>

<script>
// ── tiny helpers ────────────────────────────────────────────────
const $ = (s, r=document) => r.querySelector(s);
const el = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (n) => (Number(n)||0).toLocaleString('en-US');
const money = (n) => 'Rs ' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2 = (n) => Math.round((Number(n)||0)*100)/100;
const pct100 = (v) => Math.min(100, Math.max(0, +v||0));
const today = () => new Date().toISOString().slice(0,10);

// unwrap { ok, data } / { ok:false, error }
async function call(fn, ...args){
  const res = await fn(...args);
  if (res && typeof res==='object' && 'ok' in res){
    if(!res.ok){ throw new Error(res.error||'Unknown error'); }
    return res.data;
  }
  return res;
}
function toast(msg, err){
  const t = el(`<div class="toast ${err?'err':''}">${esc(msg)}</div>`);
  $('#toast').appendChild(t);
  setTimeout(()=>t.remove(), err?5000:2600);
}
let _modalFocus=null, _confirmCancel=null;
function _afterClose(){
  if(_confirmCancel){ const f=_confirmCancel; _confirmCancel=null; f(); }
  const p=_modalFocus; _modalFocus=null;
  if(p && p.focus) try{ p.focus(); }catch(_){}
}
function modal(title, bodyHtml, footHtml){
  const wrap = el(`<div class="overlay"><div class="modal">
    <h3>${esc(title)}</h3><div class="body">${bodyHtml}</div><div class="foot">${footHtml||''}</div>
  </div></div>`);
  wrap.addEventListener('mousedown', e=>{ if(e.target===wrap){ wrap.remove(); _afterClose(); } });
  _modalFocus = document.activeElement;
  $('#modalRoot').appendChild(wrap);
  const first = wrap.querySelector('.body input,.body select,.body textarea,.body button') || wrap.querySelector('.foot button');
  if(first) setTimeout(()=>{ try{ first.focus(); }catch(_){} }, 0);
  return wrap;
}
const closeModals = () => { $('#modalRoot').innerHTML=''; _afterClose(); };
// in-app replacement for confirm() — a native dialog leaves the window's keyboard dead until it is refocused
function appConfirm(msg, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const done=(v)=>{ _confirmCancel=null; closeModals(); resolve(v); };
    _confirmCancel=()=>resolve(false);
    const w = modal(opts.title||'Please confirm', `<div>${esc(msg).replace(/\n/g,'<br>')}</div>`,
      `<button class="btn ghost" id="cNo">Cancel</button><button class="btn${opts.danger?' danger':''}" id="cYes">${esc(opts.ok||'OK')}</button>`);
    w.addEventListener('keydown', ev=>{
      if(ev.key==='Enter'){ ev.preventDefault(); ev.stopPropagation(); done(document.activeElement!==$('#cNo',w)); }
      else if(ev.key==='Escape'){ ev.preventDefault(); ev.stopPropagation(); done(false); }
    });
    $('#cNo',w).onclick=()=>done(false);
    $('#cYes',w).onclick=()=>done(true);
    setTimeout(()=>{ try{ $('#cYes',w).focus(); }catch(_){} }, 0);
  });
}
function wireRowFilter(inputId){
  const inp=$('#'+inputId); if(!inp) return;
  const rows=Array.from($('#view').querySelectorAll('tbody tr'));
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    let shown=0;
    for(const r of rows){ const hit=!q || r.textContent.toLowerCase().includes(q); r.style.display=hit?'':'none'; if(hit) shown++; }
  });
}

// ── state ───────────────────────────────────────────────────────
const S = { brand:null, view:'dashboard', products:[], schemes:[], customers:[], settings:{},
            vans:[], bookers:[], dms:[], dashView:'sales',
            session:{van:'',booker:'',delivery_man:''}, sessionCount:0 };

const ICON = {
  dashboard:'<rect x="3" y="3" width="7.5" height="8.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.6"/><rect x="3" y="14.5" width="7.5" height="6.5" rx="1.6"/>',
  reports:'<line x1="4" y1="20" x2="20" y2="20"/><rect x="5" y="11" width="3.4" height="7" rx="1"/><rect x="10.3" y="6" width="3.4" height="12" rx="1"/><rect x="15.6" y="9" width="3.4" height="9" rx="1"/>',
  newbill:'<path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M15 3v5h5"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>',
  bills:'<path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M15 3v5h5"/><line x1="8.5" y1="13" x2="15.5" y2="13"/><line x1="8.5" y1="17" x2="13" y2="17"/>',
  load:'<rect x="1.5" y="6" width="13" height="10" rx="1.5"/><path d="M14.5 9h3.6l2.4 2.6V16h-6z"/><circle cx="5.5" cy="18" r="1.9"/><circle cx="17.5" cy="18" r="1.9"/>',
  products:'<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>',
  schemes:'<path d="M20.6 13.4 13.4 20.6a1.9 1.9 0 0 1-2.7 0L2.5 12.4V3H12l8.6 8.6a1.9 1.9 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.2"/>',
  shops:'<path d="M3.5 9 5 4h14l1.5 5"/><path d="M4.5 9v10a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1V9"/><path d="M9.5 20v-5.5h5V20"/><path d="M3.5 9h17"/>',
  purchases:'<path d="M3 8 12 3l9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5"/><line x1="12" y1="13" x2="12" y2="21"/>',
  returns:'<rect x="3.5" y="13.5" width="17" height="7.5" rx="1.6"/><path d="M7 4.5h6.5a4 4 0 0 1 0 8H12"/><polyline points="9.5 2 7 4.5 9.5 7"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  routes:'<circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="17" r="2.6"/><path d="M9.6 7h5a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h5.4"/>',
};
const ic = (name) => `<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[name]||''}</svg></span>`;
const NAV_GROUPS = [
  { title:'Overview', items:[['dashboard','Dashboard'], ['reports','Profit / Loss']] },

// ── Hotkeys ─────────────────────────────────────────────────────
const HOTNAV = {'1':'dashboard','2':'reports','3':'newbill','4':'bills','5':'load','6':'products','7':'schemes','8':'shops','9':'purchases','0':'settings'};
function showHotkeys(){
  const hk=(k,d)=>`<div class="hkrow"><span>${d}</span><span>${k}</span></div>`;
  const w=modal('Keyboard shortcuts', `
    ${hk('<kbd>Alt</kbd> + <kbd>1</kbd>…<kbd>9</kbd>, <kbd>0</kbd>','1 Dashboard · 2 Profit / Loss · 3 New Bill · 4 Bills · 5 Load Forms · 6 Products · 7 Schemes · 8 Shops · 9 Purchases · 0 Settings')}
    ${hk('<kbd>Alt</kbd> + <kbd>R</kbd>','Sales Returns — the ten digits were already taken, so Returns has its own key')}
    ${hk('<kbd>Alt</kbd> + <kbd>V</kbd>','Vans &amp; Staff — add or remove vans, bookers and delivery men')}
    ${hk('<kbd>Ctrl</kbd> + <kbd>N</kbd>','New Bill')}
    ${hk('<kbd>Enter</kbd>','Next field on New Bill (last field adds a line)')}
    ${hk('<kbd>Ctrl</kbd> + <kbd>S</kbd>','Save (bill / purchase / settings)')}
    ${hk('<kbd>Ctrl</kbd> + <kbd>P</kbd>','Print the open bill, invoice, summary or report')}
    ${hk('<kbd>Ctrl</kbd> + <kbd>F</kbd>','Jump to the search / filter box')}
    ${hk('<kbd>Esc</kbd>','Close a popup — on New Bill it saves the bill')}
    ${hk('<kbd>Ctrl</kbd> + <kbd>=</kbd> / <kbd>Ctrl</kbd> + <kbd>-</kbd>','Bigger / smaller text')}
    ${hk('<kbd>F1</kbd>','This help')}
  `, '<button class="btn" id="hkOk">Close</button>');
  w.querySelector('#hkOk').onclick=closeModals;
}
document.addEventListener('keydown', e=>{
  const k=(e.key||'').toLowerCase();
  if(k==='f1'){ e.preventDefault(); showHotkeys(); return; }
  if(k==='escape'){
    if(document.querySelector('.pvwrap')){ closePreview(); return; }
    if($('#modalRoot').children.length){ closeModals(); return; }
    if(S.view==='newbill'){ e.preventDefault(); saveBill(); }      // Esc saves the bill (fast entry)
    return;
  }
  const pvOpen=!$('#modalRoot').children.length && document.querySelector('.pvwrap');
  if($('#modalRoot').children.length || document.querySelector('.pvwrap')){
    // the print preview keeps its own shortcuts: Ctrl+P prints it, Ctrl+= / Ctrl+- resize text
    if(!(pvOpen && e.ctrlKey && !e.shiftKey && !e.altKey && (k==='p' || e.key==='=' || e.key==='+' || e.key==='-'))) return;
  }
  if(e.altKey && !e.ctrlKey && !e.shiftKey && HOTNAV[e.key]){ e.preventDefault(); go(HOTNAV[e.key]); return; }
  if(e.altKey && !e.ctrlKey && !e.shiftKey && k==='r'){ e.preventDefault(); go('returns'); return; }   // the digits are all taken
  if(e.altKey && !e.ctrlKey && !e.shiftKey && k==='v'){ e.preventDefault(); go('routes'); return; }
  if(e.ctrlKey && !e.shiftKey && !e.altKey){
    if(k==='n'){ e.preventDefault(); go('newbill'); return; }
    if(k==='s'){ const b=$('#save'); if(b){ e.preventDefault(); b.click(); } return; }
    if(k==='p'){ const pv=document.querySelector('#pvPrint'); const b=pv||$('#printOne')||$('#pr')||$('#plPrint')||$('#printLoad')||$('#dashPrint'); e.preventDefault(); if(b) b.click(); else toast('Nothing to print on this screen',true); return; }
    if(k==='f'){ const inp=$('#f_search')||$('#p_search')||$('#s_search')||$('#lf_van')||$('#b_code'); if(inp){ e.preventDefault(); inp.focus(); if(inp.select) inp.select(); } return; }
    if(e.key==='=' || e.key==='+'){ e.preventDefault(); const b=$('#fsUp'); if(b) b.click(); return; }
    if(e.key==='-'){ e.preventDefault(); const b=$('#fsDown'); if(b) b.click(); return; }
  }
});
// Enter moves to the next field — everywhere: bills, purchases, pop-up forms, filters.
// On the last box of an item line it adds a new line, so a whole bill can be typed without the mouse.
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || e.ctrlKey || e.altKey) return;
  const t=e.target;
  if(!t || t.tagName==='TEXTAREA' || t.tagName==='BUTTON' || t.type==='checkbox' || t.type==='submit') return;
  if(!/^(INPUT|SELECT)$/.test(t.tagName)) return;

  // whichever form the field belongs to — a pop-up wins over the screen behind it
  const scope = t.closest('#modalRoot') || t.closest('.pvwrap') || $('#view') || document;

  // last box of the last item line? add another line and jump into it
  const rowWrap = t.closest('#lineRows') ? '#lineRows' : (t.closest('#pRows') ? '#pRows' : (t.closest('#rRows') ? '#rRows' : null));
  if(rowWrap){
    const rows=Array.from(document.querySelectorAll(rowWrap+' tr'));
    const lastRow=rows[rows.length-1];
    const lastInputs=lastRow?Array.from(lastRow.querySelectorAll('input,select')).filter(x=>!x.disabled):[];
    if(lastInputs.length && t===lastInputs[lastInputs.length-1]){
      e.preventDefault();
      if(rowWrap==='#lineRows' && typeof draft!=='undefined' && draft){ draft.lines.push(blankLine()); renderBill(); }
      else if(rowWrap==='#pRows' && typeof purchaseDraft!=='undefined' && purchaseDraft){ purchaseDraft.lines.push(blankPLine()); renderPurchase(); }
      // a bill-linked return has fixed lines — only the van return grows
      else if(rowWrap==='#rRows' && typeof returnDraft!=='undefined' && returnDraft && !returnDraft.bill_id){ returnDraft.lines.push(blankRLine()); renderReturn(); }
      setTimeout(()=>{ const nc=document.querySelector(rowWrap+' tr:last-child input'); if(nc){ nc.focus(); } },30);
      return;
    }
  }

  const inputs=Array.from(scope.querySelectorAll('input,select'))
    .filter(el=>!el.disabled && el.type!=='hidden' && el.offsetParent!==null);
  const idx=inputs.indexOf(t);
  if(idx===-1) return;
  e.preventDefault();
  if(idx < inputs.length-1){
    const nx=inputs[idx+1]; nx.focus();
    if(nx.select && /^(text|number|search|tel)$/.test(nx.type||'text')){ try{ nx.select(); }catch(_){} }
  } else {
    // end of the form — press the main button (Save / Add) rather than doing nothing
    const go = scope.querySelector('#save') || scope.querySelector('#s');
    if(go) go.click();
  }
});
async function go(v, arg){
  S.view=v; renderNav();
  try{ await VIEWS[v](arg); }
  catch(e){ $('#view').innerHTML = `<div class="empty">Could not load this screen.<br><br><code>${esc(e.message)}</code></div>`; toast(e.message,true); }
}

// ── appearance (theme + font) ───────────────────────────────────
const FONTS = { mono:'var(--mono)', sans:'var(--sans)', serif:'var(--serif)' };
const FONT_LABELS = { mono:'Mono', sans:'Sans', serif:'Serif' };
const FS_STEPS = [11,12,13,14,15,16,18,20];
function lightenHex(hex, amt){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||''); if(!m) return hex;
  const mix=(c)=>Math.round(parseInt(c,16)+(255-parseInt(c,16))*amt);
  return '#'+[m[1],m[2],m[3]].map(mix).map(v=>v.toString(16).padStart(2,'0')).join('');
}
function applyAppearance(){
  const p=S.appearance, root=document.documentElement;
  root.dataset.theme = p.theme==='light'?'light':'dark';
  root.style.setProperty('--font', FONTS[p.font]||FONTS.mono);
  root.style.setProperty('--fs', (p.fs||13)+'px');
  root.style.setProperty('--accent', S.brand.accent);
  root.style.setProperty('--accent-soft', p.theme==='light'? lightenHex(S.brand.accent,0.88) : S.brand.accentSoft);
  // active menu text: the brand colour in light, a lightened version in dark (readable on dark panels)
  root.style.setProperty('--nav-on', p.theme==='light'? S.brand.accent : lightenHex(S.brand.accent,0.55));
  const tb=$('#themeToggle'); if(tb) tb.textContent = p.theme==='light'?'☀ Light':'☾ Dark';
}
async function saveAppearance(patch){
  Object.assign(S.appearance, patch); applyAppearance();
  try{ await call(window.api.updateSettings, {
    theme:S.appearance.theme, font_family:S.appearance.font, font_size:String(S.appearance.fs) }); }catch(e){}
}
function stepFont(dir){
  const i=FS_STEPS.indexOf(S.appearance.fs); const ni=Math.max(0,Math.min(FS_STEPS.length-1,(i<0?2:i)+dir));
  saveAppearance({ fs:FS_STEPS[ni] });
}
function setupAppearanceControls(){
  const t=$('#themeToggle'); if(t) t.onclick=()=>saveAppearance({ theme:S.appearance.theme==='light'?'dark':'light' });
  const u=$('#fsUp'); if(u) u.onclick=()=>stepFont(1);
  const d=$('#fsDown'); if(d) d.onclick=()=>stepFont(-1);
  const hb=$('#hkBtn'); if(hb) hb.onclick=showHotkeys;
}

// ── chart builders ──────────────────────────────────────────────
function fmtShort(n){ n=Number(n)||0; if(Math.abs(n)>=1000) return (n/1000).toFixed(n%1000===0?0:1)+'k'; return String(Math.round(n)); }
function barChart(series, {money=true}={}){
  const W=560,H=190, padL=8,padR=8,padT=22,padB=22;
  const n=series.length||1; const max=Math.max(1,...series.map(s=>s.value));
  const bw=(W-padL-padR)/n, iw=Math.min(46,bw*0.6);
  const base=H-padB;
  let out=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
  out+=`<line class="axis" x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}"/>`;
  series.forEach((s,i)=>{
    const cx=padL+bw*i+bw/2, h=(base-padT)*(s.value/max), y=base-h, x=cx-iw/2;
    out+=`<rect class="bar-bg" x="${x}" y="${padT}" width="${iw}" height="${base-padT}" rx="4"/>`;
    out+=`<rect class="bar" x="${x}" y="${y}" width="${iw}" height="${Math.max(0,h)}" rx="4"/>`;
    if(s.value>0) out+=`<text class="val" x="${cx}" y="${y-5}" text-anchor="middle" font-size="10">${money?fmtShort(s.value):s.value}</text>`;
    out+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="9">${esc(s.label)}</text>`;
  });
  return out+`</svg>`;
}
function hbarList(items, {money=true}={}){
  if(!items.length) return '<div class="empty">No data yet.</div>';
  const max=Math.max(1,...items.map(i=>i.value));
  return `<div class="hbars">${items.map(it=>{
    const pct=Math.round(it.value/max*100);
    return `<div class="hbar"><div class="hb-l" title="${esc(it.label)}">${esc(it.label)}</div>
      <div class="hb-track"><div class="hb-fill" style="width:${pct}%"></div></div>
      <div class="hb-v">${money?money$(it.value):num(it.value)}${it.sub?` · ${esc(it.sub)}`:''}</div></div>`;
  }).join('')}</div>`;
}
const money$ = (n)=> 'Rs '+(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
function donut(segments, opts){
  opts = opts || {}; const unit = opts.unit!==undefined ? opts.unit : 'pcs'; const asMoney = !!opts.money;
  const total=segments.reduce((s,x)=>s+x.value,0);
  const r=52,cx=60,cy=60,sw=18,C=2*Math.PI*r;
  let off=0, arcs='';
  if(total>0){
    for(const seg of segments){
      const frac=seg.value/total, dash=frac*C;
      arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}"
        stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
      off+=dash;
    }
  } else {
    arcs=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="${sw}"/>`;
  }
  const svg=`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">${arcs}
    <text x="60" y="58" text-anchor="middle" font-size="17" class="val">${fmtShort(total)}</text>
    ${unit?`<text x="60" y="74" text-anchor="middle" font-size="9">${esc(unit)}</text>`:''}</svg>`;
  const legend=`<div class="legend">${segments.map(s=>`<div class="lg"><i style="background:${s.color}"></i>${esc(s.label)}<span class="lv">${asMoney?money(s.value):num(s.value)}</span></div>`).join('')}</div>`;
  return `<div class="donut-wrap">${svg}${legend}</div>`;
}

let draft = null;

VIEWS.newbill = async () => {

  draft = (draft && !draft.editId) ? draft : newDraft();

function newDraft(){ return { lines:[ blankLine() ], bill_date:(S.settings && S.settings.current_day) || today(), shop_code:'', shop_name:'',
  shop_addr:'', class:'', tax_pct:+(S.settings.tax_rate||0), discount:0, manual_trade_offer:0, manual_trade_offer_pct:0, notes:'', scheme_off:false }; }
function blankLine(){ return { code:'', product_id:'', kind:'SALE', doz:0, pcs:0, unit_price:0, trade_offer:0, trade_offer_pct:0 }; }
function lineTotalPcs(l){ const p=prodById(l.product_id); const ppd=p?p.pcs_per_dozen:12; return (+l.doz||0)*ppd + (+l.pcs||0); }
function lineAmount(l){ return r2(lineTotalPcs(l)*(+l.unit_price||0)); }
function billSubtotal(){ return draft.lines.reduce((s,l)=> s + (l.kind==='SALE'? lineTotalPcs(l)*(+l.unit_price||0):0),0); }
// per-line offers: a % of the line, or the rupees a pre-% bill was saved with
function billLineTO(){ return draft.lines.reduce((s,l)=>{
  if(l.kind!=='SALE') return s;
  const pct=pct100(l.trade_offer_pct);
  return s + (pct>0 ? r2(lineAmount(l)*pct/100) : (+l.trade_offer||0)); },0); }
function billManualTO(sub){
  const pct=pct100(draft.manual_trade_offer_pct);
  return pct>0 ? r2(r2(sub)*pct/100) : (+draft.manual_trade_offer||0);
}
// what the scheme trade offers will take off on save — shown here so PAYABLE matches the saved bill
function billSchemeTO(sub){
  if(draft.scheme_off) return 0;
  return (S.schemes||[]).filter(s=>s.active && s.type==='TRADE_OFFER' && sub >= (+s.min_bill||0)).reduce((t,s)=>{
    const pct=pct100(s.offer_pct);
    return t + (pct>0 ? r2(sub*pct/100) : (+s.offer_amount||0));
  },0);
}
const toHint = (mto,sto)=> [mto>0?`− ${money(mto)}`:'', sto>0?`· scheme −${money(sto)}`:''].filter(Boolean).join(' ');

const userNotes = (n)=> String(n||'').replace(/\s*\|\s*Scheme:[\s\S]*$/,'').replace(/^\s*Scheme:[\s\S]*$/,'').trim();
async function editBill(id){
  const b = await call(window.api.getBill, id);
  if(!b){ toast('Bill not found',true); return; }
  await refreshCaches();
  S.session = { van:b.van||'', booker:b.booker||'', delivery_man:b.delivery_man||'' };
  draft = {
    editId:b.id, editNumber:b.bill_number,
    // a pre-% bill keeps its rupees as the fallback, so re-saving it does not change the total
    lines:(b.items||[]).filter(it=>!it.scheme_id).map(it=>({ code:it.sku_code, product_id:it.product_id, kind:it.kind,
      doz:0, pcs:it.pcs, unit_price:it.unit_price, _ratedFor:it.product_id, trade_offer:it.trade_offer||0, trade_offer_pct:it.trade_offer_pct||0 })) ,
    bill_date:b.bill_date, shop_code:b.customer_code, shop_name:b.customer_name, shop_addr:b.customer_addr,
    class:b.class, tax_pct:b.tax_pct||0, discount:b.discount||0,
    manual_trade_offer_pct:+b.manual_trade_offer_pct||0,
    manual_trade_offer:(!(+b.manual_trade_offer_pct) && +b.manual_trade_offer>0)? +b.manual_trade_offer : 0,
    notes:userNotes(b.notes), scheme_off:!!b.scheme_off
  };
  if(!draft.lines.length) draft.lines=[blankLine()];
  S.view='newbill'; renderNav(); renderBill();
}
async function saveBill(){
  if(_savingBill) return;
  if(!String(S.session.van||'').trim()){ toast('Choose a van before saving the bill',true);
    const v=$('#s_van'); if(v){ v.focus(); if(v.select) v.select(); } return; }
  const items = draft.lines.filter(l=>l.product_id).map(l=>({
    product_id:+l.product_id, kind:l.kind, pcs:lineTotalPcs(l), unit_price:+l.unit_price||0,
    trade_offer_pct:pct100(l.trade_offer_pct), trade_offer:+l.trade_offer||0 }));
  if(!items.length){ toast('Add at least one item',true); return; }
  const payload = {
    prefix:S.brand.billPrefix, bill_date:draft.bill_date,
    customer_code:draft.shop_code, customer_name:draft.shop_name, customer_addr:draft.shop_addr,
    van:S.session.van, booker:S.session.booker, delivery_man:S.session.delivery_man,
    class:draft.class, tax_pct:draft.tax_pct, discount:draft.discount,
    manual_trade_offer_pct:pct100(draft.manual_trade_offer_pct), manual_trade_offer:+draft.manual_trade_offer||0,
    scheme_off:draft.scheme_off, notes:draft.notes, items };
  _savingBill = true;
  try{
    if(draft.editId){
      const r = await call(window.api.updateBill, draft.editId, payload);
      const id=draft.editId; draft=newDraft();
      toast(`Updated ${r.bill_number} · ${money(r.total)}`);
      viewBill(id); return;
    }
    const r = await call(window.api.createBill, payload);
    lastBillId = r.id; S.sessionCount++;
    const dnote = (r.bill_date && r.bill_date!==payload.bill_date) ? ` on ${r.bill_date}` : '';
    toast(`Saved ${r.bill_number} · ${money(r.total)}${dnote} — ready for next`);
    draft = newDraft();
    try{ S.customers = await call(window.api.getCustomers); }catch(e){}
    renderBill();
    setTimeout(()=>{ const c=$('#b_code'); if(c) c.focus(); }, 30);
  }catch(e){ toast(e.message,true); }
  finally{ _savingBill = false; }
}

// Direct PDF download (no print dialog). Page height fits the content to save paper.
async function downloadPdf(name, innerHtml){
  const doc = `<!doctype html><html><head><meta charset="utf-8"><style>
    *{font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}
    body{margin:0;padding:14px;color:#000;font-size:12px}
    table{width:100%;border-collapse:collapse;margin-top:6px}
    th,td{border:1px solid #444;padding:3px 6px;text-align:left}
    th{background:#eee}
    .r{text-align:right}.nb,.nb td,.nb th{border:none!important;background:none}
  </style></head><body>${innerHtml}</body></html>`;
  try{
    const r = await window.api.savePdf({ html:doc, suggestedName:name });
    if(r && r.ok){ if(r.data && r.data.saved) toast('PDF saved'); }
    else toast((r && r.error) || 'Could not save PDF', true);
  }catch(e){ toast(e.message,true); }
}
// Send html to the hidden print root and ask Windows to print it.
function rawPrint(inner){
  const root=$('#printRoot');
  root.innerHTML=`<div class="printable">${inner}</div>`;
  setTimeout(()=>{ window.print(); setTimeout(()=>{ root.innerHTML=''; }, 1200); }, 60);
}
// Show what will be printed, then let the user print it or save it as a PDF.
function openPrintPreview(name, inner, opts){
  opts = opts || {};
  closePreview();
  const pages = opts.pages || [inner];
  const w = el(`<div class="pvwrap noprint">
      <div class="pvbar">
        <span class="ttl">Print preview — ${esc(name)}</span>
        <span class="muted" style="margin-right:6px">${pages.length} page${pages.length>1?'s':''}</span>
        <button class="btn ghost" id="pvPdf">Save as PDF</button>
        <button class="btn" id="pvPrint">Print</button>
        <button class="btn ghost" id="pvClose">Close</button>
      </div>
      <div class="pvscroll">${pages.map(p=>`<div class="pvpaper"><div class="printable">${p}</div></div>`).join('')}</div>
    </div>`);
  document.body.appendChild(w);
  // the joined markup is only built if the user actually prints / saves
  const full = ()=> inner!=null ? inner : pages.map((p,i)=>`<div style="${i<pages.length-1?'page-break-after:always':''}">${p}</div>`).join('');
  $('#pvClose',w).onclick=closePreview;
  $('#pvPrint',w).onclick=()=>rawPrint(full());
  $('#pvPdf',w).onclick=()=>downloadPdf(name, full());
  return w;
}
function closePreview(){ document.querySelectorAll('.pvwrap').forEach(x=>x.remove()); }

function newReturnDraft(){ return { return_date:(S.settings && S.settings.current_day) || today(), bill_id:null, bill_number:'', shop_code:'', shop_name:'', shop_addr:'',
  van:S.session.van, booker:S.session.booker, delivery_man:S.session.delivery_man,
  tax_pct:+(S.settings.tax_rate||0), notes:'', lines:[ blankRLine() ] }; }
function blankRLine(){ return { code:'', product_id:'', bill_item_id:null, name:'', bkind:'SALE', kind:'GOOD',
  pcs:0, unit_price:0, billed_price:null, billed_pcs:0, returned_pcs:0, remaining_pcs:0, linked:false }; }
// a credit is never worth more per piece than the shop was charged — the saved return is priced this way too
function rLineRate(l){ const rate=Math.max(0,+l.unit_price||0);
  return (l.linked && l.billed_price!=null)? Math.min(rate,+l.billed_price||0) : rate; }
// the same rules the save payload uses — an unmatched code, no pieces or a negative rate credit nothing
function rLineCredit(l){ const pcs=+l.pcs||0;
  return (l.product_id && pcs>0)? r2(pcs*rLineRate(l)) : 0; }
const rCreditCell = (l)=> l.product_id? money(rLineCredit(l)) : '<span class="muted">—</span>';
function returnSubtotal(){ return r2(returnDraft.lines.reduce((s,l)=>s+rLineCredit(l),0)); }
// the credit note mirrors the bill: the same share of its trade offer and discount comes back off the credit
function returnOffers(sub){ const d=returnDraft;
  const bs=+d.bill_subtotal||0;
  if(!d.bill_id || bs<=0) return { to:0, disc:0 };
  const ratio=Math.min(1,Math.max(0, sub/bs));
  return { to:r2((+d.bill_trade_offer||0)*ratio), disc:r2((+d.bill_discount||0)*ratio) }; }
function returnTotal(sub, tax){ const o=returnOffers(sub); return r2(sub+tax-o.to-o.disc); }
// no argument = the van-first bulk return; a bill reference = the capped, bill-linked one from a bill's screen

  d.van=b.van||d.van; d.booker=b.booker||d.booker; d.delivery_man=b.delivery_man||d.delivery_man;
  d.tax_pct=+b.tax_pct||0;
  // the bill's own totals, so the form can show the share of its offer and discount that comes back

    if(full){ d.bill_subtotal=+full.subtotal||0; d.bill_trade_offer=+full.trade_offer||0; d.bill_discount=+full.discount||0; }
  }catch(e){}
  d.lines=(b.items||[]).map(it=>({ code:it.sku_code, product_id:it.product_id, bill_item_id:it.bill_item_id,
    name:it.product_name, bkind:it.kind, kind:'GOOD', pcs:0, unit_price:+it.unit_price||0, billed_price:+it.unit_price||0,
    billed_pcs:+it.pcs||0, returned_pcs:+it.returned_pcs||0, remaining_pcs:+it.remaining_pcs||0, linked:true }));
  if(!d.lines.length){ d.lines=[blankRLine()]; toast('That bill has no items to return',true); }
  renderReturn();
}

              <option value="GOOD" ${l.kind==='GOOD'?'selected':''}>Good — back to stock</option>
              <option value="DAMAGED" ${l.kind==='DAMAGED'?'selected':''}>Damaged — written off</option></select></td>
            <td><input data-i="${i}" data-k="unit_price" type="number" step="0.01" min="0" ${l.linked&&l.billed_price!=null?`max="${l.billed_price}"`:''} value="${l.unit_price}" ${done?'disabled':''}></td>
            <td class="num">${rCreditCell(l)}</td>
            <td class="num">${done?'<span class="muted">all returned</span>':(l.linked?'':`<button class="btn sm danger" data-rm="${i}">✕</button>`)}</td>
          </tr>`;}).join('')}
      </tbody></table></div>
    </div>

    <div class="grid" style="grid-template-columns:1fr 320px;margin-top:12px">
      <div class="card"><label>${linked?'Notes':'Shops / Notes'}</label><textarea id="r_notes" rows="3" placeholder="${linked?'':'which shops the goods came from — optional'}">${esc(d.notes)}</textarea>
        <p class="muted" style="margin:8px 0 0">Good pieces go straight back into stock. Damaged pieces are written off — the credit comes off Net Sales and profit either way. The van's load form is not touched.</p></div>
      <div class="card">
        <div class="row" style="justify-content:space-between"><span class="muted">Subtotal</span><b id="rSub">${money(sub)}</b></div>
        <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Tax %</span><input id="r_tax" type="number" step="0.01" value="${d.tax_pct}" style="width:90px;text-align:right"></div>
        <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Tax</span><b id="rTax">${money(tax)}</b></div>
        ${showOff?`<div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Trade Offer</span><b id="rTO">−${money(off.to)}</b></div>
        <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Discount</span><b id="rDisc">−${money(off.disc)}</b></div>`:''}
        <div class="row" style="justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><span>CREDIT TOTAL</span><b id="rTotal" style="font-size:16px;color:var(--accent)">${money(returnTotal(sub,tax))}</b></div>
      </div>
    </div>
    ${prodDatalist()}${masterList('vanlist',S.vans)}${masterList('bookerlist',S.bookers)}${masterList('dmlist',S.dms)}`;

  // the van carries between entries; a bill-linked return uses the bill's route and leaves the session alone
  const bindSession=(id,key)=>{ const e=$('#'+id); if(!e) return;
    e.addEventListener('input',()=>{ d[key]=e.value; if(!linked) S.session[key]=e.value; });
    if(!linked) e.addEventListener('change',()=>saveSession({[key]:e.value})); };
  bindSession('s_van','van'); bindSession('s_booker','booker'); bindSession('s_dm','delivery_man');
  const vsel=$('#s_van'); if(vsel) vsel.addEventListener('change',()=>{
    const crew=vanCrew(vsel.value), patch={};
    const put=(sel,val,key)=>{ if(!val) return; const e=$('#'+sel); if(!e) return;
      if(![...e.options].some(o=>o.value===val)) e.insertAdjacentHTML('beforeend',`<option value="${esc(val)}">${esc(val)}</option>`);
      e.value=val; d[key]=val; if(!linked) S.session[key]=val; patch[key]=val; };
    put('s_booker',crew.booker,'booker'); put('s_dm',crew.dm,'delivery_man');
    if(!linked) saveSession(patch);
  });

  // credit is always the cell before the ✕ — the bill-linked table carries two extra columns
  const upLine=(i)=>{ const tr=$('#rRows').children[i]; if(!tr) return;
    const c=tr.children[tr.children.length-2]; if(c) c.innerHTML=rCreditCell(d.lines[i]); };
  const upTotals=()=>{ const sub=returnSubtotal(), tax=r2(sub*((+d.tax_pct||0)/100)), o=returnOffers(sub);
    const a=$('#rSub'); if(a) a.textContent=money(sub);
    const b=$('#rTax'); if(b) b.textContent=money(tax);
    const t=$('#rTO'); if(t) t.textContent='−'+money(o.to);
    const s=$('#rDisc'); if(s) s.textContent='−'+money(o.disc);
    const c=$('#rTotal'); if(c) c.textContent=money(returnTotal(sub,tax)); };
  if($('#addR')) $('#addR').onclick=()=>{ d.lines.push(blankRLine()); renderReturn(); };
  $('#view').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ d.lines.splice(+b.dataset.rm,1); if(!d.lines.length)d.lines.push(blankRLine()); renderReturn(); });
  $('#view').querySelectorAll('#rRows [data-i]').forEach(inp=>{
    const i=+inp.dataset.i, k=inp.dataset.k;
    if(k==='code'){ inp.addEventListener('input',()=>{ const l=d.lines[i]; l.code=inp.value; const p=prodByCode(inp.value); l.product_id=p?p.id:'';
        if(p && l._ratedFor!==p.id){ l.unit_price=p.price; l._ratedFor=p.id;
          const rc=inp.closest('tr') && inp.closest('tr').querySelector('input[data-k="unit_price"]'); if(rc) rc.value=p.price; }
        const tr=inp.closest('tr'); if(tr) tr.children[1].innerHTML=p?esc(p.name):'<span class="muted">—</span>';
        upLine(i); upTotals(); });
      return; }
    if(k==='kind'){ inp.addEventListener('change',()=>{ d.lines[i].kind=inp.value; }); return; }
    // a negative count or rate would make a credit note add to sales — floored as it is typed, so Ctrl+S cannot beat it
    const floor=()=>{ const l=d.lines[i]; if((+l[k]||0)<0){ l[k]=0; return true; } return false; };
    inp.addEventListener('input',()=>{ if(k==='unit_price') d.lines[i]._ratedFor=inp.value.trim()==='' ? null : d.lines[i].product_id; d.lines[i][k]=inp.value; floor(); upLine(i); upTotals(); });
    if(k==='pcs') inp.addEventListener('change',()=>{ const l=d.lines[i];
      if(floor() || (+inp.value||0)<0) inp.value=0;
      if(l.linked && (+l.pcs||0)>(+l.remaining_pcs||0)){ l.pcs=+l.remaining_pcs||0; inp.value=l.pcs;
        toast(`Only ${num(l.remaining_pcs)} pcs are left to return on that line`,true); }
      upLine(i); upTotals(); });
    if(k==='unit_price') inp.addEventListener('change',()=>{ const l=d.lines[i];
      if(floor() || (+inp.value||0)<0) inp.value=0;
      if(l.linked && l.billed_price!=null && (+l.unit_price||0)>(+l.billed_price||0)){ l.unit_price=+l.billed_price||0; inp.value=l.unit_price;
        toast(`That line was billed at ${money(l.billed_price)} — a credit cannot be worth more`,true); }
      upLine(i); upTotals(); });
  });

  const bindF=(id,key)=>{ const e=$('#'+id); if(e) e.addEventListener('input',()=>{ d[key]=e.value; }); };
  bindF('r_date','return_date'); bindF('r_notes','notes');
  const taxEl=$('#r_tax'); taxEl.addEventListener('input',()=>{ d.tax_pct=+taxEl.value||0; upTotals(); });
  $('#cancel').onclick=()=>{ returnDraft=null; VIEWS.returns(S._retFilter); };
  $('#save').onclick=saveReturn;
}
async function saveReturn(){
  if(_savingReturn) return;
  const d=returnDraft;
  if(!String(d.van||'').trim()){ toast('Choose a van before saving the return',true);
    const v=$('#s_van'); if(v){ v.focus(); if(v.select) v.select(); } return; }
  const over = d.lines.find(l=>l.linked && (+l.pcs||0)>(+l.remaining_pcs||0));
  if(over){ toast(`${over.code||over.name} — only ${num(over.remaining_pcs)} pcs are left to return`,true); return; }
  const items = d.lines.filter(l=>l.product_id && (+l.pcs||0)>0).map(l=>({
    bill_item_id:l.bill_item_id||null, product_id:+l.product_id, kind:l.kind,
    pcs:Math.max(0,+l.pcs||0), unit_price:rLineRate(l) }));
  if(!items.length){ toast('Enter the pieces coming back on at least one line',true); return; }
  const payload = {
    return_date:d.return_date, prefix:S.brand.returnPrefix,
    bill_id:d.bill_id||null, bill_number:d.bill_number||null,
    customer_code:d.shop_code, customer_name:d.shop_name, customer_addr:d.shop_addr,
    van:d.van, booker:d.booker, delivery_man:d.delivery_man,
    tax_pct:+d.tax_pct||0, notes:d.notes, items };
  _savingReturn=true;
  try{ const r=await call(window.api.createReturn, payload);
    const dnote=(r.return_date && r.return_date!==payload.return_date)?` on ${r.return_date}`:'';
    toast(`Saved ${r.return_number} · ${money(r.total)}${dnote}`); returnDraft=null; VIEWS.returns(S._retFilter); }
  catch(e){ toast(e.message,true); }
  finally{ _savingReturn=false; }
}

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function periodLabel(period, gran){
  if(gran==='monthly' && /^\d{4}-\d{2}$/.test(period)) return MONTHS[+period.slice(5,7)-1]+' '+period.slice(0,4);
  return period;
}
function chartLabel(period, gran){
  if(gran==='daily')   return period.slice(5);           // MM-DD
  if(gran==='weekly')  return period.slice(5);           // Www
  if(gran==='monthly' && /^\d{4}-\d{2}$/.test(period)) return MONTHS[+period.slice(5,7)-1];
  return period;                                          // year
}

function blankPLine(){ return { code:'', product_id:'', pcs:0, unit_cost:0 }; }
function pLineAmt(l){ return (+l.pcs||0)*(+l.unit_cost||0); }
function purchaseForm(){ purchaseDraft = { purchase_date:(S.settings && S.settings.current_day) || today(), vehicle_no:'', supplier:'', notes:'', lines:[ blankPLine() ] }; renderPurchase(); }
async function editPurchase(id){
  const p=await call(window.api.getPurchaseById,id); if(!p){ toast('Not found',true); return; }
  await refreshCaches();
  purchaseDraft = { editId:p.id, editNumber:p.purchase_number, purchase_date:p.purchase_date, vehicle_no:p.vehicle_no||'', supplier:p.supplier||'', notes:p.notes||'',
    lines:(p.items||[]).map(it=>({ code:it.sku_code, product_id:it.product_id, pcs:it.pcs, unit_cost:it.unit_cost, _costFor:it.product_id })) };
  if(!purchaseDraft.lines.length) purchaseDraft.lines=[blankPLine()];
  S.view='purchases'; renderNav(); renderPurchase();
}
function renderPurchase(){
  const d=purchaseDraft; const total=d.lines.reduce((s,l)=>s+pLineAmt(l),0);
  $('#view').innerHTML = `
    <div class="head"><h2>${d.editId?('Edit Purchase '+esc(d.editNumber||'')):'New Purchase'}</h2><div class="row">

    <div class="card"><div class="f3">
      <div><label>Date</label><input id="p_date" type="date" value="${d.purchase_date}"></div>
      <div><label>Vehicle No</label><input id="p_veh" value="${esc(d.vehicle_no)}" placeholder="ABC-123"></div>
      <div><label>Supplier</label><input id="p_sup" value="${esc(d.supplier)}"></div>
    </div></div>
    <div class="card" style="margin-top:12px">
      <div class="row" style="margin-bottom:10px"><label style="margin:0">Items</label><span class="muted">Type a product code — cost auto-fills; amount = pieces × cost.</span><button class="btn sm right" id="addP">+ Add Line</button></div>
      <div class="tablewrap"><table><thead><tr><th style="width:120px">Code</th><th>Product</th><th class="num">Pieces</th><th class="num">Unit Cost</th><th class="num">Amount</th><th></th></tr></thead><tbody id="pRows">
        ${d.lines.map((l,i)=>{ const p=prodById(l.product_id); return `<tr>
          <td><input data-i="${i}" data-k="code" list="prodcodes" value="${esc(l.code)}" autocomplete="off"></td>
          <td>${p?esc(p.name):'<span class="muted">—</span>'}</td>
          <td><input data-i="${i}" data-k="pcs" type="number" value="${l.pcs}"></td>
          <td><input data-i="${i}" data-k="unit_cost" type="number" step="0.01" value="${l.unit_cost}"></td>

          <td class="num"><button class="btn sm danger" data-rm="${i}">✕</button></td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px;gap:10px"><span class="muted">Total</span><b id="pTotal" style="font-size:16px;color:var(--accent)">${money(total)}</b></div>
    </div>${prodDatalist()}`;
  const reb=()=>renderPurchase();
  const upTot=()=>{ const el=$('#pTotal'); if(el) el.textContent=money(d.lines.reduce((s,l)=>s+pLineAmt(l),0)); };
  $('#addP').onclick=()=>{ d.lines.push(blankPLine()); reb(); };
  $('#view').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ d.lines.splice(+b.dataset.rm,1); if(!d.lines.length)d.lines.push(blankPLine()); reb(); });
  const upAmt=(i)=>{ const tr=$('#pRows').children[i]; if(tr) tr.children[4].textContent=money(pLineAmt(d.lines[i])); };
  $('#view').querySelectorAll('#pRows [data-i]').forEach(inp=>{
    const i=+inp.dataset.i, k=inp.dataset.k;
    if(k==='code'){ inp.addEventListener('input',()=>{ const l=d.lines[i]; l.code=inp.value; const p=prodByCode(inp.value); l.product_id=p?p.id:'';
        if(p && l._costFor!==p.id){ l.unit_cost=p.cost; l._costFor=p.id;
          const cc=inp.closest('tr') && inp.closest('tr').querySelector('input[data-k="unit_cost"]'); if(cc) cc.value=p.cost; }
        const tr=inp.closest('tr'); if(tr) tr.children[1].innerHTML=p?esc(p.name):'<span class="muted">—</span>';
        upAmt(i); upTot(); });
      return; }
    inp.addEventListener('input',()=>{ if(k==='unit_cost') d.lines[i]._costFor=inp.value.trim()==='' ? null : d.lines[i].product_id; d.lines[i][k]=inp.value; upAmt(i); upTot(); });
  });
  const bindF=(id,key)=>{ const e=$('#'+id); if(e) e.addEventListener('input',()=>{ d[key]=e.value; }); };
  bindF('p_date','purchase_date'); bindF('p_veh','vehicle_no'); bindF('p_sup','supplier');
  $('#cancel').onclick=()=>VIEWS.purchases();
  $('#save').onclick=savePurchase;
}
async function savePurchase(){
  if(_savingPurchase) return;
  const d=purchaseDraft; const items=d.lines.filter(l=>l.product_id).map(l=>({product_id:+l.product_id,pcs:+l.pcs||0,unit_cost:+l.unit_cost||0}));
  if(!items.length){ toast('Add at least one product',true); return; }
  _savingPurchase=true;
  const payload={purchase_date:d.purchase_date,vehicle_no:d.vehicle_no,supplier:d.supplier,notes:d.notes,items};
  try{
    if(d.editId){ const r=await call(window.api.updatePurchase,d.editId,payload);
      toast(`Updated ${r.purchase_number} · ${money(r.total)}`); }
    else { const r=await call(window.api.createPurchase,payload);
      const dnote=(r.purchase_date && r.purchase_date!==d.purchase_date)?` on ${r.purchase_date}`:'';
      toast(`Saved ${r.purchase_number} · ${money(r.total)}${dnote}`); }
    purchaseDraft=null; VIEWS.purchases(); }catch(e){ toast(e.message,true); }
  finally{ _savingPurchase=false; }
}

      <label>Business</label>
      <div style="margin-top:6px"><label>Brand name</label><input value="${esc(S.brand.name)}" disabled></div>
      <p class="muted" style="margin:6px 0 12px">Fixed per build. This install: <b>${esc(S.brand.id)}</b>.</p>
      <div><label>Address</label><input id="st_addr" value="${esc(S.settings.business_address||'')}"></div>
      <div style="margin-top:12px"><label>Phone</label><input id="st_phone" value="${esc(S.settings.business_phone||'')}"></div>
      <div class="f3" style="margin-top:12px">
        <div><label>Business NTN</label><input id="st_ntn" value="${esc(S.settings.business_ntn||'')}"></div>
        <div><label>Business GST No.</label><input id="st_gst" value="${esc(S.settings.business_gst||'')}"></div>
        <div><label>GST Rate %</label><input id="st_gstrate" type="number" step="0.01" value="${esc(S.settings.gst_rate||0)}"></div>
      </div>
      <div class="f2" style="margin-top:12px">
        <div><label>Default Tax %</label><input id="st_tax" type="number" step="0.01" value="${esc(S.settings.tax_rate||0)}"></div>
        <div><label>Currency Symbol</label><input id="st_cur" value="${esc(S.settings.currency_symbol||'Rs')}"></div>
      </div>
    </div>

    <div class="card" style="max-width:640px;margin-top:12px">
      <label>Working day</label>
      <p class="muted" style="margin:6px 0 12px">New bills, purchases and returns are dated to the working day below. It stays put across real calendar days until you close it — closing moves it to the next open day. New entries are never blocked; they roll onto the next open day. Closed days stay locked so their records can't be edited or deleted.</p>
      <div class="row" style="align-items:center;gap:12px">
        <div>Currently working on <b>${esc(S.settings.current_day||today())}</b></div>
        <button class="btn right" id="dc_close">Close working day (${esc(S.settings.current_day||today())}) &amp; start next</button>
      </div>
      <div id="dc_list" style="margin-top:14px"></div>
    </div>

    <div class="card" style="max-width:640px;margin-top:12px">
      <label>Vans, Bookers &amp; Delivery Men</label>
      <p class="muted" style="margin:6px 0 12px">These now have their own screen. Add or remove vans, order bookers and delivery men there — they appear as dropdowns to pick on every bill and return.</p>
      <button class="btn" data-nav="routes">Open Vans &amp; Staff →</button>
    </div>

    <div class="card" style="max-width:640px;margin-top:12px">
      <label>Data, backup &amp; starting fresh</label>
      <p class="muted" style="margin:6px 0 12px">Your information is kept on this computer, not inside the app folder — so unzipping a newer copy of the app keeps everything you already entered. Use the buttons here to take a backup, put one back, or clear the data.</p>
      <div id="dataStats" class="muted" style="margin-bottom:12px">Loading…</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn" id="dBackup">Save a backup</button>
        <button class="btn ghost" id="dRestore">Restore from backup</button>
        <button class="btn ghost" id="dFolder">Open backup folder</button>
        <button class="btn ghost" id="dSample">Load sample data</button>
      </div>
      <p class="muted" style="margin:10px 0 0"><b>Load sample data</b> fills the app with a month of made-up bills, returns, purchases and load forms so you can show someone how it works. It only works when the app is empty — clear the data first.</p>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <label style="color:var(--danger)">Start fresh</label>
        <p class="muted" style="margin:6px 0 10px">A backup is taken automatically before anything is deleted, so a mistake can always be undone.</p>
        <div class="f2" style="gap:12px">
          <div><label>Owner PIN</label><input id="dPin" type="password" placeholder="${S.settings.owner_pin?'Enter your PIN':'Not set — leave blank'}" autocomplete="off"></div>
          <div><label>Type RESET to confirm</label><input id="dConfirm" placeholder="RESET" autocomplete="off"></div>
        </div>
        <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn ghost" id="dClear">Clear bills, returns, loads &amp; purchases</button>
          <button class="btn danger" id="dErase">Erase everything</button>
        </div>
        <p class="muted" style="margin:10px 0 0"><b>Clear</b> removes the day-to-day records but keeps your products, shops, schemes and company details. <b>Erase everything</b> puts the app back to how it was on the day you installed it — your company details are filled in again automatically.</p>
      </div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <label>Set / change the owner PIN</label>
        <p class="muted" style="margin:6px 0 10px">Optional. Set a PIN so staff cannot clear the data. Leave blank for no PIN.</p>
        <div class="row" style="gap:8px;align-items:flex-end">
          <div style="flex:0 0 220px"><input id="dNewPin" placeholder="New PIN (or blank for none)" autocomplete="off"></div>
          <button class="btn ghost" id="dSetPin">Save PIN</button>
        </div>
      </div>
    </div>`;

  const wireSeg=(sel,attr,cast,key)=>{
    $('#view').querySelectorAll(`${sel} [data-${attr}]`).forEach(b=>b.onclick=()=>{
      const val=cast(b.getAttribute(`data-${attr}`));
      saveAppearance({ [key]: val });
      $(sel).querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    });
  };
  wireSeg('#segTheme','theme-opt',String,'theme');
  wireSeg('#segFont','font-opt',String,'font');
  wireSeg('#segSize','size-opt',Number,'fs');

  async function renderClosedDays(){
    const days = await call(window.api.listClosedDays);
    const box=$('#dc_list'); if(!box) return;
    box.innerHTML = days.length
      ? `<label>Closed dates</label><div class="tablewrap" style="margin-top:6px"><table><thead><tr><th>Date</th><th>Closed at</th><th></th></tr></thead><tbody>
          ${days.map(d=>`<tr><td>${esc(d.date)}</td><td class="muted">${esc(d.closed_at)||''}</td><td class="num"><button class="btn sm ghost" data-open="${esc(d.date)}">Open</button></td></tr>`).join('')}
        </tbody></table></div>`
      : '<p class="muted">No dates are closed.</p>';
    box.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{ try{ const r=await call(window.api.openDay, b.dataset.open); if(r&&r.current_day) S.settings.current_day=r.current_day; toast('Date re-opened'); VIEWS.settings(); }catch(e){ toast(e.message,true); } });
  }
  $('#dc_close').onclick=async()=>{ const d=S.settings.current_day||today();
    try{ const r=await call(window.api.closeDay, d); if(r&&r.current_day) S.settings.current_day=r.current_day;
      toast(`Closed ${d} — now working on ${S.settings.current_day}`); VIEWS.settings(); }catch(e){ toast(e.message,true); } };
  renderClosedDays();

  // Vans / Bookers / Delivery Men manager
  const MK_LABEL={van:'van',booker:'booker',dm:'delivery man'};
  async function renderMasters(kind){
    const items = await call(window.api.listMasters, kind);
    const box=$('#list_'+kind); if(!box) return;
    box.innerHTML = items.length
      ? items.map(m=>`<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(128,128,128,.12);border:1px solid var(--line);border-radius:6px;padding:3px 4px 3px 9px;margin:0 5px 5px 0;font-size:12px">${esc(m.name)}<button class="btn sm ghost" style="padding:1px 6px" data-del="${m.id}">✕</button></span>`).join('')
      : '<span class="muted" style="font-size:12px">None yet.</span>';
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ try{ await call(window.api.deleteMaster,+b.dataset.del); renderMasters(kind); refreshCaches(); }catch(e){ toast(e.message,true); } });
  }
  $('#view').querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{
    const kind=b.dataset.add, inp=$('#m_'+kind), name=(inp.value||'').trim();
    if(!name){ toast(`Enter a ${MK_LABEL[kind]} name`,true); return; }
    try{ await call(window.api.addMaster,{kind,name}); inp.value=''; inp.focus(); toast('Added'); renderMasters(kind); refreshCaches(); }catch(e){ toast(e.message,true); }
  });
  $('#view').querySelectorAll('#m_van,#m_booker,#m_dm').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const kind=inp.id.slice(2); const btn=$('#view').querySelector(`[data-add="${kind}"]`); if(btn) btn.click(); } }));
  ['van','booker','dm'].forEach(renderMasters);

  // ── Data, backup & starting fresh ──
  const fmtKb=(n)=> n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(n/1024))+' KB';
  async function showDataStats(){
    try{
      const d = await call(window.api.dataStats);
      const rets = d.sales_returns!=null ? d.sales_returns : d.returns;
      $('#dataStats').innerHTML = `Right now this app holds <b>${num(d.bills)}</b> bills, <b>${num(d.load_forms)}</b> load forms, `
        + (rets!=null ? `<b>${num(rets)}</b> returns, ` : '')
        + `<b>${num(d.purchases)}</b> purchases, <b>${num(d.products)}</b> products and <b>${num(d.customers)}</b> shops `
        + `(${fmtKb(d.size)}).<br><span style="font-size:11.5px">Stored at: <code>${esc(d.path)}</code></span>`;
    }catch(e){ $('#dataStats').textContent = 'Could not read the data file.'; }
  }
  showDataStats();
  $('#dBackup').onclick=async()=>{ try{ const r=await call(window.api.backupData);
    toast(r.saved? 'Backup saved' : 'Backup cancelled', !r.saved); }catch(e){ toast(e.message,true); } };
  $('#dFolder').onclick=()=>call(window.api.openBackupFolder).catch(e=>toast(e.message,true));
  $('#dSample').onclick=async()=>{
    if(!await appConfirm('Fill the app with a month of sample data for a demonstration?\n\nThis only works on an empty app — if you have real data, take a backup and clear it first.',{ok:'Load sample data'})) return;
    try{ const r=await call(window.api.loadSampleData); toast(`Sample data loaded — ${r.bills} bills`); }
    catch(e){ toast(e.message,true); }
  };
  $('#dRestore').onclick=async()=>{
    if(!await appConfirm('Restore from a backup?\n\nEverything currently in the app will be replaced by the backup you choose. A safety copy of the current data is taken first.',{danger:true,ok:'Restore'})) return;
    try{ const r=await call(window.api.restoreData); if(r.restored) toast('Backup restored — reloading'); else toast('Restore cancelled',true); }
    catch(e){ toast(e.message,true); }
  };
  const guardOk=()=>{
    const pin=(S.settings.owner_pin||'').trim();
    if(pin && ($('#dPin').value||'').trim()!==pin){ toast('Wrong PIN',true); return false; }
    if((($('#dConfirm').value)||'').trim().toUpperCase()!=='RESET'){ toast('Type RESET in the confirm box first',true); return false; }
    return true;
  };
  const doReset=async(scope, msg)=>{
    if(!guardOk()) return;
    if(!await appConfirm(msg,{danger:true,ok:scope==='everything'?'Erase everything':'Clear records'})) return;
    try{ const r=await call(window.api.resetData,{scope});
      toast(scope==='everything'?'Everything erased — starting fresh':'Records cleared');
    }catch(e){ toast(e.message,true); }
  };
  $('#dClear').onclick=()=>doReset('transactions',
    'Clear all bills, returns, load forms and purchases?\n\nProducts, shops, schemes and your company details are kept.\nA backup is saved automatically first.');
  $('#dErase').onclick=()=>doReset('everything',
    'ERASE EVERYTHING?\n\nAll bills, returns, load forms, purchases, products, shops and schemes will be deleted and the app will start as if newly installed.\nA backup is saved automatically first.');
  $('#dSetPin').onclick=async()=>{
    const pin=(S.settings.owner_pin||'').trim();
    if(pin && ($('#dPin').value||'').trim()!==pin){ toast('Enter the current PIN in the Owner PIN box to change it',true); return; }
    try{ await call(window.api.updateSettings,{ owner_pin: ($('#dNewPin').value||'').trim() });
      S.settings = await call(window.api.getSettings);
      toast(($('#dNewPin').value||'').trim()? 'PIN saved' : 'PIN removed'); VIEWS.settings();
    }catch(e){ toast(e.message,true); }
  };

  $('#save').onclick=async()=>{
    try{ await call(window.api.updateSettings, {
      business_address:$('#st_addr').value, business_phone:$('#st_phone').value,
      business_ntn:$('#st_ntn').value, business_gst:$('#st_gst').value, gst_rate:$('#st_gstrate').value,
      tax_rate:$('#st_tax').value, currency_symbol:$('#st_cur').value });
      S.settings = await call(window.api.getSettings);
      toast('Settings saved'); }catch(e){ toast(e.message,true); }
  };
};

// ── boot ────────────────────────────────────────────────────────
(async function init(){
  S.brand = window.brand || { id:'haramain', name:'Marketing Services', accent:'#1d4f91', accentSoft:'#0e2a4f', billPrefix:'HMS', loadPrefix:'HL', returnPrefix:'HR' };
  $('#brandName').textContent = S.brand.name;
  $('#brandFoot').textContent = S.brand.id;
  const _av = $('#brandAvatar');
  if (S.brand.logo){
    _av.innerHTML = `<img src="${S.brand.logo}" alt="" style="width:100%;height:100%;object-fit:contain">`;
    _av.style.background = '#fff'; _av.style.padding = '2px';
  } else {
    _av.textContent = (S.brand.name||'S').trim().charAt(0).toUpperCase();
  }
  document.title = S.brand.name + (S.brand.isDemo ? '  —  DEMO' : '');
  if (S.brand.isDemo){
    const sub=document.querySelector('.brand .sub');
    if (sub) sub.innerHTML = 'DEMO &middot; sample data';
    const bn=$('#brandName');
    if (bn && !bn.dataset.demo){ bn.dataset.demo='1';
      bn.insertAdjacentHTML('beforeend', ' <span style="display:inline-block;background:var(--accent);color:#fff;border-radius:5px;padding:1px 6px;font-size:9.5px;letter-spacing:.6px;vertical-align:middle">DEMO</span>'); }
  }
  S.appearance = { theme:'light', font:'sans', fs:14 };
  applyAppearance();
  setupAppearanceControls();
  renderNav();
  if (!window.api){
    $('#view').innerHTML = '<div class="empty">Data bridge failed to load.<br>Please close and reopen the app.</div>';
    return;
  }
  try{
    S.settings = await call(window.api.getSettings);
    S.appearance = {
      theme: S.settings.theme==='dark' ? 'dark' : 'light',
      font:  FONTS[S.settings.font_family] ? S.settings.font_family : 'sans',
      fs:    FS_STEPS.indexOf(parseInt(S.settings.font_size,10))>=0 ? parseInt(S.settings.font_size,10) : 14,
    };
    applyAppearance();
    S.session = { van:S.settings.session_van||'', booker:S.settings.session_booker||'', delivery_man:S.settings.session_dm||'' };
  }catch(e){}
  go('dashboard');
})();
</script>
</body>
</html>
